name: pii-proxy

services:
  pii-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: pii-proxy:1.0.0
    container_name: pii-proxy
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      WORKERS: "3"
      DB_PATH: /data/state.db
    volumes:
      - pii-data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pii-data:
    name: pii-data